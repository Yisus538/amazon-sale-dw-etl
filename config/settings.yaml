# ─────────────────────────────────────────────
# CONFIGURACIÓN DEL PROYECTO ETL — Amazon DW
# Metodología HEFESTO
# ─────────────────────────────────────────────

project:
  name: "Amazon Sale Report — Data Warehouse"
  version: "1.0.0"
  metodologia: "HEFESTO v3"

# Rutas de datos
paths:
  raw:       "data/01_raw/"
  interim:   "data/02_interim/"
  processed: "data/03_processed/"

# Archivo fuente
source:
  filename: "Amazon_Sale_Report.csv"
  encoding: "utf-8"
  date_format: "%m-%d-%y"

# Base de datos destino
# Las credenciales se leen desde .env — no ponerlas acá
database:
  schema: "amazon_dw"
  tablas:
    dim_tiempo:    "dimTiempo"
    dim_producto:  "dimProducto"
    dim_geografia: "dimGeografia"
    dim_canal:     "dimCanal"
    fact_ventas:   "factVentas"

# Transformación — valores por defecto para nulos
defaults:
  courier_status: "Desconocido"
  ciudad:         "No Informado"
  estado:         "No Informado"
  pais:           "IN"
  promociones:    "Sin Promocion"
  fulfilled_by:   "No Informado"
  amount:         0
  qty:            0

# Estado de órdenes canceladas (para separar indicadores)
estados_cancelados:
  - "Cancelled"
